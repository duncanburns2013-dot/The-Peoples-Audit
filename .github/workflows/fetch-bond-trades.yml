name: Refresh MA Bond Trades

on:
  schedule:
    # Every 6 hours, on the hour
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: 'fetch-bond-trades'
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run fetcher
        run: node scripts/fetch-ma-bond-trades.mjs

      - name: Show output (debug)
        run: |
          echo "----- ma-bond-trades.json -----"
          head -c 4000 public/data/ma-bond-trades.json || true
          echo
          echo "-------------------------------"

      - name: Commit & push if changed
        uses: ./.github/actions/commit-and-push-data
        with:
          paths: public/data/ma-bond-trades.json
          message: "chore(data): refresh MA bond trades from EMMA [skip ci]"
          regenerate-index: 'false'
