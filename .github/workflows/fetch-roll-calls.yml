name: Refresh MA Roll-Call Tally

on:
  schedule:
    # Twice a week: Tuesday + Friday at 10:00 UTC. The ~1500-bill sample
    # (750/chamber) is stable enough that daily refresh would be churn;
    # legislative business is also concentrated in formal sessions, not
    # weekends. The fetcher is wall-clock-budgeted (see MAX_RUNTIME_MS) so it
    # always writes a fresh partial scan within the job's timeout.
    - cron: '0 10 * * 2,5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: 'fetch-roll-calls'
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run fetcher
        run: node scripts/fetch-roll-calls.mjs

      - name: Show source health (debug)
        run: |
          node -e "const d = JSON.parse(require('fs').readFileSync('public/data/ma-roll-calls.json','utf8')); console.log('fetchedAt:', d.fetchedAt); console.log('billsScanned:', d.billsScanned, 'of', d.billsTotal); console.log('totals:', JSON.stringify(d.totals)); console.log('ratios:', JSON.stringify(d.ratios));"

      - name: Rebuild data freshness index
        run: node scripts/build-data-index.mjs

      - name: Commit & push if changed
        uses: ./.github/actions/commit-and-push-data
        with:
          paths: public/data/ma-roll-calls.json public/data/_index.json
          message: "chore(data): refresh MA roll-call tally [skip ci]"
